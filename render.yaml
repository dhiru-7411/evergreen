# Render Blueprint for the API. Connect the repo in Render → New → Blueprint,
# then fill in the secrets it prompts for (sync: false).
services:
  - type: web
    name: evergreen-api
    runtime: node
    plan: free # free instance: sleeps after 15 min idle, ~1 min to wake
    region: virginia # next to the default Atlas region (AWS us-east-1)
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production # login cookies are Secure (HTTPS-only)
      - key: TRUST_PROXY
        value: 2 # browser -> Vercel rewrite -> Render -> app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # your Vercel/Netlify URL, e.g. https://evergreen.vercel.app (checked on every write request)
      # Account emails (verification, password reset), e.g. Brevo's free SMTP
      - key: SMTP_HOST
        sync: false # smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # the SMTP login Brevo shows, e.g. 9abc123@smtp-brevo.com
      - key: SMTP_PASS
        sync: false # the SMTP key Brevo generates
      - key: MAIL_FROM
        sync: false # e.g. Evergreen <you@example.com>
      - key: APP_URL
        sync: false # public site address for email links, e.g. https://evergreen.vercel.app
